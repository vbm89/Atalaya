name: Shadow OB audit

on:
  push:
    branches: [research/shadow-ob-audit]
  pull_request:
    branches: [research/shadow-ob-audit]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

name: Shadow OB audit

on:
  push:
    branches: [research/shadow-ob-audit]
  pull_request:
    branches: [research/shadow-ob-audit]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The repository currently has unrelated pre-existing typecheck errors.
      # Keep the diagnostic visible without blocking the research-only OB gate.
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run test
      - run: npm run build

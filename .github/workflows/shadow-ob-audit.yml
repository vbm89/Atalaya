name: Shadow OB audit

on:
  push:
    branches: [research/shadow-ob-audit]
  pull_request:
    branches: [research/shadow-ob-audit]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # Repository-wide typecheck currently has unrelated baseline errors.
      # Keep it diagnostic, but do not let it mask the research gate below.
      - name: Typecheck (diagnostic)
        run: npm run typecheck
        continue-on-error: true

      - name: Verify V1 protection
        run: npm run check:v1-sha

      - name: Run OB research tests
        run: node --experimental-strip-types --import ./scripts/register-ts-ext.mjs --test src/lib/learn/shadow-discovery.test.ts

      - name: Run full test suite
        run: npm run test

      - name: Build
        run: npm run build

name: Atalaya paper inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atalaya-paper-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Read-only inspect of the new Aiven database
        env:
          PAPER_DATABASE_URL: ${{ secrets.PAPER_DATABASE_URL }}
          PAPER_DB_HOST: ${{ secrets.PAPER_DB_HOST }}
          PAPER_DB_NAME: ${{ secrets.PAPER_DB_NAME }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "Only a manual dispatch is allowed." >&2
            exit 1
          fi
          if [ -n "${DATABASE_URL-}" ]; then
            echo "DATABASE_URL must not be set for inspect." >&2
            exit 1
          fi
          node scripts/paper-db-inspect.mjs

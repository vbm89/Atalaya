name: Atalaya paper inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atalaya-paper-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Read-only database inspect
        env:
          ACTION: inspect
          MIGRATION_CONFIRM: ""
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAPER_DB_HOST: ${{ secrets.PAPER_DB_HOST }}
          PAPER_DB_NAME: ${{ secrets.PAPER_DB_NAME }}
        run: |
          set -euo pipefail
          if [ "$ACTION" != "inspect" ]; then
            echo "This workflow only inspects." >&2
            exit 1
          fi
          if [ -z "${DATABASE_URL}" ] || [ -z "${PAPER_DB_HOST}" ] || [ -z "${PAPER_DB_NAME}" ]; then
            echo "Database secrets are not configured." >&2
            exit 1
          fi
          node scripts/paper-db-guard.mjs

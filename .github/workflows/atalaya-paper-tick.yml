name: Atalaya Paper Tick

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger authenticated watch tick on DEV
        env:
          WATCH_SECRET: ${{ secrets.WATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WATCH_SECRET}" ]; then
            echo "WATCH_SECRET is not configured for GitHub Actions" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Cache-Control: no-cache" \
            -H "Authorization: Bearer ${WATCH_SECRET}" \
            "https://atalaya-dev.vercel.app/api/watch/tick"

name: Atalaya Paper Tick

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger durable paper tick on DEV
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured for GitHub Actions" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Cache-Control: no-cache" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://atalaya-dev.vercel.app/api/bot"
